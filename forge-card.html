<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Forge | Digital Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .heading-font { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; letter-spacing: -0.025em; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden p-6 text-center relative">
        
        <!-- Header Branding -->
        <div class="mb-6">
            <div class="w-12 h-12 bg-amber-500/10 border border-amber-500/30 rounded-xl flex items-center justify-center mx-auto mb-3 text-amber-500">
                <i data-lucide="flame" class="w-6 h-6"></i>
            </div>
            <span class="text-[10px] font-black uppercase tracking-widest text-amber-500">THE FORGE MENTORSHIP INITIATIVE</span>
        </div>

        <!-- Dynamic Profile Content -->
        <h1 id="card-name" class="heading-font text-2xl font-bold text-white mb-1">Loading...</h1>
        <p id="card-title" class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-6">Recruiting Team</p>

        <!-- Action Buttons -->
        <div class="space-y-3 mb-6">
            <button onclick="downloadVCard()" class="w-full py-3 px-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-amber-500/10">
                <i data-lucide="user-plus" class="w-4 h-4"></i> Save Contact
            </button>
            <a id="btn-apply" href="forge.html" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm rounded-xl transition flex items-center justify-center gap-2 border border-slate-700">
                <i data-lucide="file-text" class="w-4 h-4"></i> Apply for Forge
            </a>
        </div>

        <!-- Contact Links -->
        <div class="space-y-2 text-left text-xs border-t border-slate-800 pt-4 text-slate-300">
            <a id="link-phone" href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-800/60 transition">
                <i data-lucide="phone" class="w-4 h-4 text-amber-500"></i>
                <span id="txt-phone">--</span>
            </a>
            <a id="link-email" href="#" class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-800/60 transition">
                <i data-lucide="mail" class="w-4 h-4 text-amber-500"></i>
                <span id="txt-email">--</span>
            </a>
            <a href="https://www.rlgroff.com/forge.html" class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-800/60 transition">
                <i data-lucide="globe" class="w-4 h-4 text-amber-500"></i>
                <span>rlgroff.com/forge.html</span>
            </a>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-800/60 text-[10px] text-slate-500">
            Iron Sharpens Iron • Proverbs 27:17
        </div>
    </div>

    <script>
        // Central Team Roster Configuration
        const TEAM = {
            groff: {
                name: "R.L. Groff",
                title: "Initiative Leader & Anvil",
                phone: "+13215550199",
                phoneDisplay: "(321) 555-0199",
                email: "groff@rlgroff.com"
            },
            bowers: {
                name: "Bowers",
                title: "Forge Recruiter & Anvil",
                phone: "+13215550101",
                phoneDisplay: "(321) 555-0101",
                email: "bowers@rlgroff.com"
            },
            fyler: {
                name: "Fyler",
                title: "Forge Recruiter & Anvil",
                phone: "+13215550102",
                phoneDisplay: "(321) 555-0102",
                email: "fyler@rlgroff.com"
            },
            mcclain: {
                name: "McClain",
                title: "Forge Recruiter & Anvil",
                phone: "+13215550103",
                phoneDisplay: "(321) 555-0103",
                email: "mcclain@rlgroff.com"
            },
            torkelson: {
                name: "Torkelson",
                title: "Forge Recruiter & Anvil",
                phone: "+13215550104",
                phoneDisplay: "(321) 555-0104",
                email: "torkelson@rlgroff.com"
            }
        };

        // Parse query param ?id=name
        const params = new URLSearchParams(window.location.search);
        const memberId = (params.get('id') || 'groff').toLowerCase();
        const profile = TEAM[memberId] || TEAM['groff'];

        // Populate Page Data
        document.getElementById('card-name').innerText = profile.name;
        document.getElementById('card-title').innerText = profile.title;
        document.getElementById('txt-phone').innerText = profile.phoneDisplay;
        document.getElementById('link-phone').href = `tel:${profile.phone}`;
        document.getElementById('txt-email').innerText = profile.email;
        document.getElementById('link-email').href = `mailto:${profile.email}`;

        // Dynamic vCard Generation
        function downloadVCard() {
            const vcardData = `BEGIN:VCARD
VERSION:3.0
N:${profile.name};;;;
FN:${profile.name}
ORG:The Forge Mentorship Initiative
TITLE:${profile.title}
TEL;TYPE=CELL:${profile.phone}
EMAIL:${profile.email}
URL:https://www.rlgroff.com/forge.html
NOTE:Iron Sharpens Iron - Biblical Mentorship Initiative
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `${profile.name.replace(/\s+/g, '_')}_Forge.vcf`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.addEventListener("DOMContentLoaded", function() {
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });
    </script>
</body>
</html>
